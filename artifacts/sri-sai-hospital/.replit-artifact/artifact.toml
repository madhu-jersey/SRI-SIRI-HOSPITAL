kind = "web"
previewPath = "/"
title = "Sri Sai Hospital"
description = "A polished, responsive single-page website for Sri Sai Hospital in Tanuku, featuring clinic hours, doctors, services, patient reviews, health videos, and visit information."
version = "1.0.0"
id = "artifacts/sri-sai-hospital"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24485

[services.development]
run = "pnpm --filter @workspace/sri-sai-hospital run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sri-sai-hospital", "run", "build" ]
serve = "static"
publicDir = "artifacts/sri-sai-hospital/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24485"
BASE_PATH = "/"
